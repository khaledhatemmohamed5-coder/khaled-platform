<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس منصة المستر خالد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .lock-screen { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: inline-block; }
        input { padding: 10px; width: 200px; border-radius: 5px; border: 1px solid #ddd; margin-bottom: 10px; text-align: center; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #video-content { display: none; } /* الفيديو مخفي في البداية */
        .video-container { margin-top: 20px; background: white; padding: 20px; border-radius: 15px; }
    </style>
</head>
<body>

    <div id="login-screen" class="lock-screen">
        <h2>أدخل باسورد الحصة للدخول</h2>
        <p>الباسورد بتاخده من المستر خالد شخصياً</p>
        <input type="password" id="pass-field" placeholder="اكتب الباسورد هنا">
        <br>
        <button onclick="checkPass()">فتح الدروس</button>
        <p id="error-msg" style="color: red; display: none;">الباسورد غلط.. كلم المستر!</p>
    </div>

    <div id="video-content">
        <h1>مرحباً بك في حصة اليوم</h1>
        <div class="video-container">
            <iframe width="100%" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>
        </div>
        <button onclick="location.reload()" style="margin-top:20px; background:#dc3545;">تسجيل خروج</button>
    </div>

    <script>
        function checkPass() {
            var pass = document.getElementById("pass-field").value;
            // الباسورد بتاعك هو 1234 (تقدر تغيره من هنا)
            if (pass === "1234") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("video-content").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
    </script>
</body>
</html>
