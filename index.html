<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل طالب جديد</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; text-align: center; background: #eee; }
        .reg-card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; border-radius: 5px; }
    </style>
</head>
<body>

<div class="reg-card">
    <h2>تسجيل بيانات الطالب</h2>
    <input type="text" id="studentName" placeholder="اسم الطالب الرباعي">
    <input type="tel" id="studentPhone" placeholder="رقم الهاتف (واتساب)">
    <button onclick="sendData()">إرسال البيانات</button>
</div>

<script>
    // كود الربط الخاص بك
    const firebaseConfig = {
        apiKey: "AIzaSyA3z8T5rbd5xQdKkCSqwTg-XcL2BTThfRQ",
        authDomain: "khaled-platform-27373.firebaseapp.com",
        databaseURL: "https://khaled-platform-27373-default-rtdb.firebaseio.com",
        projectId: "khaled-platform-27373",
        storageBucket: "khaled-platform-27373.firebasestorage.app",
        messagingSenderId: "143088371235",
        appId: "1:143088371235:web:72959ec1a269c74d389396"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function sendData() {
        const name = document.getElementById('studentName').value;
        const phone = document.getElementById('studentPhone').value;

        if(name && phone) {
            db.ref('students').push({
                name: name,
                phone: phone,
                accepted: false // بيبدأ بـ "غير مقبول" لحد ما أنت تدوس قبول
            }).then(() => {
                alert("تم إرسال بياناتك بنجاح، انتظر تفعيل الحساب من المستر.");
                document.getElementById('studentName').value = "";
                document.getElementById('studentPhone').value = "";
            });
        } else {
            alert("من فضلك كمل البيانات");
        }
    }
</script>
</body>
</html>
