<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>طلب انضمام - منصة خالد</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>طلب انضمام جديد</h2>
        <form action="https://formspree.io/f/xgorkpjv" method="POST">
            <input type="text" name="اسم الطالب" placeholder="الاسم الثلاثي" required>
            <input type="text" name="رقم الموبايل" placeholder="رقم الموبايل" required>
            <input type="text" name="كود الاشتراك" placeholder="كود الاشتراك (أو رقم التحويل)" required>
            <button type="submit">إرسال الطلب للمستر</button>
        </form>
        <br>
        <a href="index.html" style="text-decoration:none; color:#1a73e8;">رجوع</a>
    </div>

</body>
</html>
