<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - منصة خالد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #555; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: right; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .back-link { margin-top: 15px; display: block; text-decoration: none; color: #1a73e8; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>طلب انضمام جديد</h2>
        <p>املأ بياناتك وسيتم مراجعة طلبك وتفعيل الحساب خلال ساعات</p>
        
        <input type="text" id="name" placeholder="الاسم الثلاثي بالكامل" required>
        <input type="text" id="phone" placeholder="رقم الهاتف (الذي ستدخل به)" required>
        <input type="text" id="payment" placeholder="رقم التحويل أو كود الاشتراك" required>
        
        <button onclick="sendRequest()">إرسال طلب الانضمام</button>
        
        <a href="index.html" class="back-link">العودة لصفحة الدخول</a>
    </div>

    <script>
        function sendRequest() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const payment = document.getElementById('payment').value;

            if(name == "" || phone == "" || payment == "") {
                alert("برجاء ملء جميع البيانات");
                return;
            }

            // دي رسالة تأكيد للطالب
            alert("شكراً لك يا " + name + "!\nتم استلام طلبك بنجاح. سيتم تفعيل حسابك فور التأكد من الكود.");
            
            // يرجعه لصفحة الدخول
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
